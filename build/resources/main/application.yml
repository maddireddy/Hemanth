server:
  port: 8080

spring:
  kafka:
    bootstrap-servers: localhost:9092

app:
  kafka:
    topic: efg-platform-list
    # The class used by the AvroReflectSerializer (the full class name)
    reflect-class: com.pnc.efg.avro.schema.platformList.EfgPlatformList
    # If you use Schema Registry with Confluent serializer, set Schema Registry URL here
    schema-registry-url: http://localhost:8081
